<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Image Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #1e293b;
        }

        .radio-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 1.1rem;
        }

        .radio-label input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .instruction-text {
            background-color: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #475569;
            margin-bottom: 24px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-upload {
            margin-bottom: 24px;
            text-align: left;
        }

        .file-upload input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
            transition: var(--transition);
            background-color: #fafafa;
        }

        .file-upload input[type="file"]:hover {
            border-color: #94a3b8;
            background-color: #f1f5f9;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            margin-top: 20px;
            font-weight: 500;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(100, 116, 139, 0.2);
            border-radius: 50%;
            border-top-color: #64748b;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-area {
            display: none;
            margin-top: 24px;
            padding: 20px;
            border-radius: 8px;
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            font-weight: 600;
            opacity: 0.8;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .error {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Image Analysis</h1>

        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="imageType" value="MRI" checked> MRI
            </label>
            <label class="radio-label">
                <input type="radio" name="imageType" value="X-Ray"> X-Ray
            </label>
        </div>

        <div class="instruction-text" id="instructionText">
            We will tell whether you have: pituitary, notumor, meningioma, glioma
        </div>

        <div class="file-upload">
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <button class="btn" id="showBtn">Show</button>

        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div> Processing...
        </div>

        <div class="result-area" id="resultArea">
            <div class="result-title">Analysis Result</div>
            <div class="result-value" id="resultValue">--</div>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

        const mriText = "We will tell whether you have: pituitary, notumor, meningioma, glioma";
        const xrayText = "We will tell whether you have: Cardiomegaly, Emphysema, Effusion, Hernia, Infiltration, Mass, Nodule, Atelectasis, Pneumothorax, Pleural_Thickening, Pneumonia, Fibrosis, Edema, Consolidation";

        const radios = document.querySelectorAll('input[name="imageType"]');
        const instructionText = document.getElementById('instructionText');
        const imageInput = document.getElementById('imageInput');
        const showBtn = document.getElementById('showBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultArea = document.getElementById('resultArea');
        const resultValue = document.getElementById('resultValue');

        // Handle radio button changes
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'MRI') {
                    instructionText.textContent = mriText;
                } else {
                    instructionText.textContent = xrayText;
                }
            });
        });

        // Handle show button click
        showBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            const selectedType = document.querySelector('input[name="imageType"]:checked').value;

            if (!file) {
                alert("Please select an image file first.");
                return;
            }

            showBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            resultArea.style.display = 'none';
            resultArea.classList.remove('error');

            try {
                const app = await Client.connect("CGAllenger/BTech");

                // We determine the endpoint index based on your Tabs in app.py
                // Tab 0 is MRI, Tab 1 is X-Ray
                const endpointIndex = (selectedType === 'MRI') ? 0 : 1;

                // Use the index number instead of "/predict"
                const result = await app.predict(endpointIndex, [file]);

                let topLabel = "Unknown";
                let topProb = 0;

                // Gradio Labels usually return data in result.data[0].confidences
                const data = result.data[0];

                if (data && data.confidences) {
                    const topResult = data.confidences[0]; // Already sorted by top_classes in your py file
                    topLabel = topResult.label;
                    topProb = topResult.confidence;
                } else if (typeof data === 'object') {
                    // Fallback for different dictionary formats
                    for (const [label, prob] of Object.entries(data)) {
                        if (prob > topProb) {
                            topProb = prob;
                            topLabel = label;
                        }
                    }
                }

                const percentage = (topProb * 100).toFixed(2);
                resultValue.textContent = `${topLabel}: ${percentage}%`;
                resultArea.style.display = 'block';

            } catch (error) {
                console.error("Error during prediction:", error);
                resultValue.textContent = "Error: Check if Space is 'Running'";
                resultArea.classList.add('error');
                resultArea.style.display = 'block';
            } finally {
                showBtn.disabled = false;
                loadingIndicator.style.display = 'none';
            }
        });
    </script>
</body>
</html>
