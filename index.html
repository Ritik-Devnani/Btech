<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Image Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --card-bg: #ffffff;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: #1e293b;
        }

        .file-upload {
            margin-bottom: 24px;
            text-align: left;
        }

        .file-upload input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            box-sizing: border-box;
            transition: var(--transition);
            background-color: #fafafa;
        }

        .file-upload input[type="file"]:hover {
            border-color: #94a3b8;
            background-color: #f1f5f9;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            display: none;
            margin-top: 20px;
            font-weight: 500;
            color: #64748b;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(100, 116, 139, 0.2);
            border-radius: 50%;
            border-top-color: #64748b;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .modality-status {
            display: none;
            margin-top: 24px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            font-weight: 600;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease;
        }

        .result-area {
            display: none;
            margin-top: 16px;
            padding: 20px;
            border-radius: 8px;
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            font-weight: 600;
            opacity: 0.8;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .error {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Medical Image Analyzer</h1>

        <div class="file-upload">
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <button class="btn" id="analyzeBtn">Analyze Scan</button>

        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div> Processing...
        </div>

        <div class="modality-status" id="modalityStatus"></div>

        <div class="result-area" id="resultArea">
            <div class="result-title">Top Diagnosis</div>
            <div class="result-value" id="resultValue">--</div>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

        const imageInput = document.getElementById('imageInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const modalityStatus = document.getElementById('modalityStatus');
        const resultArea = document.getElementById('resultArea');
        const resultValue = document.getElementById('resultValue');

        // Handle analyze button click
        analyzeBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];

            if (!file) {
                alert("Please select an image file first.");
                return;
            }

            analyzeBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            modalityStatus.style.display = 'none';
            resultArea.style.display = 'none';
            resultArea.classList.remove('error');
            
            // Revert background to success state in case it was an error before
            resultArea.style.backgroundColor = '#ecfdf5';
            resultArea.style.borderColor = '#a7f3d0';
            resultArea.style.color = '#065f46';

            try {
                const app = await Client.connect("CGAllenger/BTech");

                // Call the unified analysis endpoint (index 0 since there's only one api route)
                const result = await app.predict(0, [file]);

                const modalityString = result.data[0];
                const diagData = result.data[1];

                // Update and show modality status
                if (modalityString) {
                    modalityStatus.textContent = modalityString;
                    modalityStatus.style.display = 'block';
                }

                let topLabel = "Unknown";
                let topProb = 0;

                // Gradio Labels usually return data in result.data[1].confidences
                if (diagData && diagData.confidences && diagData.confidences.length > 0) {
                    // Sort by confidence to be absolutely sure we get the top 1
                    const sortedConfidences = diagData.confidences.sort((a, b) => b.confidence - a.confidence);
                    const topResult = sortedConfidences[0];
                    topLabel = topResult.label;
                    topProb = topResult.confidence;
                } else if (typeof diagData === 'object' && diagData !== null) {
                    // Fallback for simple dictionary format
                    for (const [label, prob] of Object.entries(diagData)) {
                        if (typeof prob === 'number' && prob > topProb) {
                            topProb = prob;
                            topLabel = label;
                        }
                    }
                }

                const percentage = (topProb * 100).toFixed(2);
                resultValue.textContent = `${topLabel}: ${percentage}%`;
                resultArea.style.display = 'block';

            } catch (error) {
                console.error("Error during prediction:", error);
                
                // Hide modality status on error
                modalityStatus.style.display = 'none';
                
                // Show error in result area
                document.querySelector('#resultArea .result-title').textContent = "Error";
                resultValue.textContent = "Failed to connect to the analysis server.";
                resultArea.classList.add('error');
                
                // Apply error styles directly as a fallback
                resultArea.style.backgroundColor = '#fef2f2';
                resultArea.style.borderColor = '#fecaca';
                resultArea.style.color = '#991b1b';
                
                resultArea.style.display = 'block';
            } finally {
                analyzeBtn.disabled = false;
                loadingIndicator.style.display = 'none';
                
                // Reset result title text back if it was changed by an error previously
                if (!resultArea.classList.contains('error')) {
                    document.querySelector('#resultArea .result-title').textContent = "Top Diagnosis";
                }
            }
        });
    </script>
</body>

</html>
